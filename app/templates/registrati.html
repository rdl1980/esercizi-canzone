{% extends "base.html" %}
{% block titolo %}Registrati · Esercizi canzone{% endblock %}
{% block contenuto %}
<section class="scheda stretta">
  <h1>Crea un account</h1>
  <form id="form-registrazione" data-api="/api/auth/registrazione" data-vai="/" novalidate>
    <label>Email <input type="email" name="email" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      <small>Almeno 8 caratteri.</small></label>
    <p class="errore" id="errore" hidden></p>
    <button type="submit" class="bottone primario">Registrati</button>
  </form>
  <p class="nota">Hai già un account? <a href="/login">Accedi</a></p>
</section>
{% endblock %}
